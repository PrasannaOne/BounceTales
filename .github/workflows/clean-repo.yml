name: One-time repository cleanup (V16 reset)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE_REPO_CONTENTS to remove tracked files outside .github/workflows
        required: true
        type: string
permissions:
  contents: write
jobs:
  clean:
    if: ${{ inputs.confirm == 'DELETE_REPO_CONTENTS' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove tracked repository content except workflows
        shell: bash
        run: |
          git rm -r -f --ignore-unmatch -- . ':!.github' ':!.github/workflows'
          git rm -r -f --ignore-unmatch -- .github -- ':!.github/workflows' || true
          git add -A
          if git diff --cached --quiet; then echo "Nothing to clean"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: one-time V16 repository reset"
          git push
      - name: Safety notice
        run: echo "Preserved .github/workflows, including Pages deployment and this cleanup workflow."
