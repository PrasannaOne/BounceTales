name: Project quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check ZIP importer
        run: python -m py_compile tools/import_runtime_zip.py
      - name: Run repository verification suite
        run: npm run verify
      - name: Validate PWA manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Validate uploaded runtime ZIP when present
        if: ${{ hashFiles('Bounce.zip') != '' }}
        run: python tools/import_runtime_zip.py Bounce.zip . --validate-only
