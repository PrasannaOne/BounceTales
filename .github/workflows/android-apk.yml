
name: Bounce Tales Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Bounce Tales APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get the existing game
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 5. Prepare the original game files
      - name: Prepare web assets
        run: |
          mkdir -p www

          cp index.html style.css game.js www/
          cp manifest.webmanifest sw.js www/

          cp favicon.png icon-192.png icon-512.png www/
          cp apple-touch-icon.png www/

          cp -R src assets www/

      # 6. Install Capacitor without modifying package.json
      - name: Install Capacitor
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      # 7. Initialize Android wrapper
      - name: Initialize Capacitor
        run: |
          npx cap init "Bounce Tales" \
            "com.prasanna.bouncetales" \
            --web-dir www

      # 8. Generate Android project
      - name: Add Android platform
        run: npx cap add android

      # 9. Copy game into Android
      - name: Sync Android project
        run: npx cap sync android

      # 10. Build APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bounce-Tales-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
