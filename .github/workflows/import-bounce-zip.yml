name: Import Bounce Tales full project ZIP

on:
  push:
    branches: [main]
    paths: ["Bounce.zip"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bounce-tales-full-project-import
  cancel-in-progress: false

jobs:
  import-project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate full project ZIP before import
        shell: bash
        run: |
          set -euo pipefail
          test -f Bounce.zip || { echo "::error::Bounce.zip is missing."; exit 1; }
          python tools/import_runtime_zip.py Bounce.zip . --validate-only
      - name: Merge complete project without deleting repository-only files
        run: python tools/import_runtime_zip.py Bounce.zip .
      - name: Verify merged project
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/import_runtime_zip.py
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest','utf8'))"
          npm run verify
      - name: Commit merged project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No project changes detected; refusing a false-success import."
            exit 1
          fi
          git commit -m "Import validated Bounce Tales full project"
          git push origin HEAD:main
