name: Extract Bounce Tales ZIP

on:
  push:
    branches:
      - main
    paths:
      - "BounceTales_Branch_Deploy_Root.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-bounce-tales
  cancel-in-progress: false

jobs:
  extract:
    # The bot's own commit must not start another extraction run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="BounceTales_Branch_Deploy_Root.zip"
          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE is missing from the repository root."
            exit 1
          }

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Reject archive entries that could write outside the temporary folder.
          while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..)
                echo "ERROR: Unsafe ZIP entry: $entry"
                exit 1
                ;;
            esac
          done < <(unzip -Z1 "$ZIP_FILE")

          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          for required in index.html game.js style.css; do
            test -s "$TEMP_DIR/$required" || {
              echo "ERROR: ZIP is missing $required at its root."
              exit 1
            }
          done

          # Copy the website files into main's root.
          cp -a "$TEMP_DIR/." .

          # Remove the uploaded ZIP after successful extraction.
          rm -f "$ZIP_FILE"

      - name: Commit extracted files and delete ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract Bounce Tales website from uploaded ZIP"
            git push origin HEAD:main
          fi
