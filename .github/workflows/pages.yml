
name: Deploy Bounce Tales from ZIP

on:
  push:
    branches:
      - main
    paths:
      - "Bounce.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bounce-tales-zip-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and safely extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Bounce.zip"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Bounce.zip is missing or empty."
            exit 1
          fi

          python3 - "$ZIP_FILE" "$TEMP_DIR" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import PurePosixPath, Path

          archive = sys.argv[1]
          destination = Path(sys.argv[2])

          MAX_ENTRIES = 20000
          MAX_TOTAL_SIZE = 500 * 1024 * 1024
          MAX_FILE_SIZE = 100 * 1024 * 1024

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()

              if not entries:
                  raise SystemExit("ZIP archive is empty.")

              if len(entries) > MAX_ENTRIES:
                  raise SystemExit("ZIP contains too many entries.")

              seen = set()
              total_size = 0

              for item in entries:
                  original = item.filename
                  name = original.replace("\\", "/")

                  if not name or "\x00" in name:
                      raise SystemExit("ZIP contains an invalid path.")

                  if name.startswith("/") or PurePosixPath(name).is_absolute():
                      raise SystemExit(f"Absolute ZIP path rejected: {name}")

                  parts = name.rstrip("/").split("/")

                  if (
                      not parts
                      or any(part in ("", ".", "..") for part in parts)
                      or ":" in parts[0]
                  ):
                      raise SystemExit(f"Unsafe ZIP path rejected: {name}")

                  normalized = "/".join(parts)

                  if normalized in seen:
                      raise SystemExit(f"Duplicate ZIP path: {normalized}")

                  seen.add(normalized)

                  mode = item.external_attr >> 16
                  file_type = stat.S_IFMT(mode)

                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic link rejected: {name}")

                  if file_type not in (0, stat.S_IFREG, stat.S_IFDIR):
                      raise SystemExit(f"Special ZIP entry rejected: {name}")

                  if item.flag_bits & 1:
                      raise SystemExit(f"Encrypted entry rejected: {name}")

                  if item.file_size > MAX_FILE_SIZE:
                      raise SystemExit(f"File exceeds 100 MB limit: {name}")

                  total_size += item.file_size

                  if total_size > MAX_TOTAL_SIZE:
                      raise SystemExit("ZIP exceeds the 500 MB extraction limit.")

              for item in entries:
                  name = item.filename.replace("\\", "/")
                  parts = name.rstrip("/").split("/")
                  target = destination.joinpath(*parts)

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(item) as source, target.open("xb") as output:
                      shutil.copyfileobj(source, output)

          print(f"Validated and extracted {len(entries)} ZIP entries.")
          PY

          # Support either a ZIP with files at its root or
          # a ZIP containing one enclosing project directory.
          shopt -s nullglob dotglob
          ITEMS=("$TEMP_DIR"/*)

          SOURCE_DIR="$TEMP_DIR"

          if [[ ${#ITEMS[@]} -eq 1 && -d "${ITEMS[0]}" ]]; then
            SOURCE_DIR="${ITEMS[0]}"
          fi

          # Required project structure.
          test -s "$SOURCE_DIR/index.html" || {
            echo "::error::ZIP is missing index.html at its project root."
            exit 1
          }

          test -s "$SOURCE_DIR/style.css" || {
            echo "::error::ZIP is missing style.css."
            exit 1
          }

          test -s "$SOURCE_DIR/game.js" || {
            echo "::error::ZIP is missing game.js."
            exit 1
          }

          test -s "$SOURCE_DIR/sw.js" || {
            echo "::error::ZIP is missing sw.js."
            exit 1
          }

          test -s "$SOURCE_DIR/manifest.webmanifest" || {
            echo "::error::ZIP is missing manifest.webmanifest."
            exit 1
          }

          test -d "$SOURCE_DIR/assets" || {
            echo "::error::ZIP is missing the assets directory."
            exit 1
          }

          test -d "$SOURCE_DIR/src" || {
            echo "::error::ZIP is missing the src directory."
            exit 1
          }

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "ZIP structure validation passed."

      - name: Synchronize approved website files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$SOURCE_DIR"

          # Only approved root-level runtime files can be replaced.
          ROOT_FILES=(
            index.html
            style.css
            game.js
            sw.js
            manifest.webmanifest
            favicon.png
            favicon.ico
            icon-192.png
            icon-512.png
            apple-touch-icon.png
            bounce-tales-web-preview.png
          )

          for file in "${ROOT_FILES[@]}"; do
            if [[ -f "$SOURCE/$file" ]]; then
              install -D -m 0644 "$SOURCE/$file" "$file"
              echo "Updated: $file"
            fi
          done

          # Synchronize runtime directories only.
          # --delete removes obsolete files inside these directories,
          # never repository documentation or workflow configuration.
          RUNTIME_DIRS=(
            assets
            src
            icons
          )

          for dir in "${RUNTIME_DIRS[@]}"; do
            if [[ -d "$SOURCE/$dir" ]]; then
              mkdir -p "$dir"

              rsync -a --delete \
                --safe-links \
                "$SOURCE/$dir/" "$dir/"

              echo "Synchronized directory: $dir"
            fi
          done

          echo "Runtime synchronization completed."

      - name: Validate synchronized website
        shell: bash
        run: |
          set -euo pipefail

          test -s index.html
          test -s style.css
          test -s game.js
          test -s sw.js
          test -s manifest.webmanifest
          test -d assets
          test -d src

          node --check game.js

          python3 - <<'PY'
          import json

          with open("manifest.webmanifest", encoding="utf-8") as f:
              manifest = json.load(f)

          if not isinstance(manifest, dict):
              raise SystemExit("PWA manifest must contain a JSON object.")

          print("PWA manifest JSON validation passed.")
          PY

          echo "Website validation passed."

      - name: Check deployment scope
        shell: bash
        run: |
          set -euo pipefail

          # Refuse to commit anything outside the approved runtime paths.
          python3 <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "status", "--porcelain", "-z"],
              check=True,
              stdout=subprocess.PIPE
          )

          entries = result.stdout.decode("utf-8", "surrogateescape").split("\0")
          changed = []

          for entry in entries:
              if not entry:
                  continue

              path = entry[3:]
              changed.append(path)

          root_files = {
              "index.html",
              "style.css",
              "game.js",
              "sw.js",
              "manifest.webmanifest",
              "favicon.png",
              "favicon.ico",
              "icon-192.png",
              "icon-512.png",
              "apple-touch-icon.png",
              "bounce-tales-web-preview.png",
          }

          allowed_dirs = ("assets/", "src/", "icons/")

          unexpected = [
              path for path in changed
              if path not in root_files
              and not path.startswith(allowed_dirs)
          ]

          if unexpected:
              print("Unexpected changes detected:")
              for path in unexpected:
                  print(f"  - {path}")
              sys.exit("Refusing to commit outside approved runtime paths.")

          print(f"Deployment scope verified: {len(changed)} changed paths.")
          PY

      - name: Commit website changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # The scope check above ensures only approved runtime paths
          # have changed. This also safely handles new and deleted files.
          git add -A

          if git diff --cached --quiet; then
            echo "No website changes detected."
            exit 0
          fi

          git commit -m "Deploy Bounce Tales website from ZIP"

          git push origin HEAD:main

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Bounce Tales deployment completed"
            echo ""
            echo "- ZIP validation: passed"
            echo "- Runtime synchronization: passed"
            echo "- JavaScript syntax check: passed"
            echo "- PWA manifest validation: passed"
            echo "- Deployment scope protection: passed"
            echo "- Repository documentation and workflow files: protected"
            echo "- Deployment commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
          
