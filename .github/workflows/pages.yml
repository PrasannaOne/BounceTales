name: Extract Bounce Tales ZIP
on:
  push:
    branches:
      - main
    paths:
      - "Bounce.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bounce-tales-zip-extraction
  cancel-in-progress: false

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Bounce.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "No $ZIP_FILE found. Nothing to extract."
            exit 0
          fi

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Reject unsafe paths and symbolic links before extracting.
          python3 - "$ZIP_FILE" <<'PY'
          import stat
          import sys
          import zipfile
          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename.replace("\\", "/")
                  parts = name.split("/")
                  if name.startswith("/") or any(p == ".." for p in parts):
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                  mode = item.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ZIP symlinks are not allowed: {item.filename}")
          PY

          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          # Unwrap if ChatGPT placed everything inside a single top-level folder
          SOURCE_DIR="$TEMP_DIR"
          shopt -s nullglob
          top_items=("$TEMP_DIR"/*)
          if [[ ${#top_items[@]} -eq 1 && -d "${top_items[0]}" ]]; then
            SOURCE_DIR="${top_items[0]}"
          fi

          if [[ ! -s "$SOURCE_DIR/index.html" ]]; then
            echo "ERROR: Bounce.zip is missing index.html."
            exit 1
          fi

          # Mirror extracted site into main's root while keeping .git, .github, and any other ZIPs untouched
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.zip' \
            "$SOURCE_DIR/" ./

          # Delete Bounce.zip after successful extraction
          rm -f "$ZIP_FILE"

      - name: Commit extracted website and remove ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract Bounce Tales website from Bounce.zip"
          git push origin HEAD:main
          
