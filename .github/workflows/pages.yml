name: Build and deploy Bounce Tales

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bounce-tales-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract ZIP into the repository
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="BounceTales_HTML_Port_Development_Package.zip"
          test -f "$PACKAGE"
          rm -rf game
          mkdir -p game
          unzip -q "$PACKAGE" -d _unpacked
          test -f "_unpacked/BounceTales_HTML_Port/index.html"
          cp -a "_unpacked/BounceTales_HTML_Port/." game/
          test -f game/index.html
          test -f game/game.js
          test -d game/assets/original
          rm -rf _unpacked

      - name: Commit extracted website files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A game
          if git diff --cached --quiet; then
            echo "Extracted website is already up to date."
          else
            git commit -m "Build extracted Bounce Tales website"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload deployable website
        uses: actions/upload-pages-artifact@v3
        with:
          path: game

  deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
