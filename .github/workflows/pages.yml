name: Extract Bounce Tales ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bounce-tales-zip-extraction
  cancel-in-progress: false

jobs:
  extract:
    # Avoid looping if a later human-triggered run sees a bot-authored push.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="BounceTales_Branch_Deploy_Root.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "No $ZIP_FILE found. Nothing to extract."
            exit 0
          fi

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Reject unsafe paths and symbolic links before extracting.
          python3 - "$ZIP_FILE" <<'PY'
          import stat
          import sys
          import zipfile

          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename.replace("\\", "/")
                  parts = name.split("/")
                  if name.startswith("/") or any(p == ".." for p in parts):
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                  mode = item.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ZIP symlinks are not allowed: {item.filename}")
          PY

          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          # This package is expected to contain the website at its ZIP root.
          for file in index.html game.js style.css; do
            if [[ ! -s "$TEMP_DIR/$file" ]]; then
              echo "ERROR: ZIP is missing $file at its root."
              exit 1
            fi
          done

          if [[ ! -d "$TEMP_DIR/assets/original" ]]; then
            echo "ERROR: ZIP is missing assets/original/."
            exit 1
          fi

          # Mirror the ZIP contents into main's root, preserving Git metadata
          # and this workflow directory. Old generated site files are removed.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$TEMP_DIR/" ./

          # Delete the uploaded archive only after validation and extraction.
          rm -f "$ZIP_FILE"

      - name: Commit extracted website and remove ZIP
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Bounce Tales website from uploaded ZIP"
          git push origin HEAD:main
